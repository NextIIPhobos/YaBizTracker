<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body,#map{width:100%;height:100%;margin:0;padding:0;overflow:hidden}</style>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script></head><body><div id="map"></div><script>
let myMap=null,markers={},webChannel=null,cityObjects=[],markerLayouts={},currentPeriodDays=30,selectedMarkerIds=new Set(),viewportToken=0,lastViewport=null;
const COLORS={fresh:'#00C800',recent:'#FFD700',medium:'#00BFFF',old:'#969696'};
function markerColor(age,periodDays){age=Math.max(0,Number(age)||0);const days=Math.max(1,Number(periodDays)||30),t=Math.min(1,age/days);if(t<=1/3)return lerp(COLORS.fresh,COLORS.recent,t*3);if(t<=2/3)return lerp(COLORS.recent,COLORS.medium,(t-1/3)*3);return lerp(COLORS.medium,COLORS.old,(t-2/3)*3)}
function ensureMarkerLayouts(){if(markerLayouts.normal)return;markerLayouts.normal=ymaps.templateLayoutFactory.createClass('<div style="width:12px;height:12px;border-radius:50%;background:$[properties.markerColor];border:1px solid rgba(255,255,255,.95);box-sizing:border-box;cursor:pointer;"></div>');markerLayouts.selected=ymaps.templateLayoutFactory.createClass('<div style="width:20px;height:20px;border-radius:50%;background:$[properties.markerColor];border:2px solid #fff;box-shadow:0 0 0 2px rgba(255,0,0,.55),0 2px 6px rgba(0,0,0,.45);box-sizing:border-box;cursor:pointer;"></div>')}
function applyMarkerVisual(m,selected){if(!m)return;ensureMarkerLayouts();m.properties.set('markerColor',selected?'#FF0000':markerColor(m.properties.get('ageDays'),currentPeriodDays));m.options.set({iconLayout:selected?markerLayouts.selected:markerLayouts.normal,zIndex:selected?10000:100});}
function lerp(a,b,t){let A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16),ar=A>>16,ag=(A>>8)&255,ab=A&255,br=B>>16,bg=(B>>8)&255,bb=B&255,r=Math.round(ar+(br-ar)*t),g=Math.round(ag+(bg-ag)*t),bl=Math.round(ab+(bb-ab)*t);return '#'+((1<<24)|(r<<16)|(g<<8)|bl).toString(16).slice(1)}
function notifyMarkerClicked(id){const key=String(id);selectedMarkerIds=new Set([key]);const marker=markers[key];if(marker)applyMarkerVisual(marker,true);try{const bridge=window.bridge||(webChannel&&webChannel.objects&&webChannel.objects.bridge);if(bridge&&typeof bridge.onMarkerClicked==='function'){bridge.onMarkerClicked(key);return true}}catch(err){console.error('MapBridge marker click error',err)}return false}
function addMarker(o){if(!myMap)return;if(markers[o.id])myMap.geoObjects.remove(markers[o.id]);ensureMarkerLayouts();const id=String(o.id);const selected=selectedMarkerIds.has(id);const m=new ymaps.Placemark([Number(o.latitude),Number(o.longitude)],{balloonContentHeader:o.name||'',balloonContentBody:(o.address||'')+'<br><b>'+((o.category||'')+(o.subcategory?' → '+o.subcategory:''))+'</b>',markerColor:selected?'#FF0000':markerColor(o.age_days,currentPeriodDays),ageDays:Number(o.age_days)||0},{iconLayout:selected?markerLayouts.selected:markerLayouts.normal,iconShape:{type:'Circle',coordinates:[0,0],radius:selected?10:6},zIndex:selected?10000:100});m.events.add('click',function(e){notifyMarkerClicked(id);if(e&&typeof e.stopPropagation==='function')e.stopPropagation();return false});markers[id]=m;myMap.geoObjects.add(m)}
function removeMarker(id){if(markers[id]){myMap.geoObjects.remove(markers[id]);delete markers[id]}}
function clearAllMarkers(){Object.keys(markers).forEach(removeMarker)}
function updateMarkers(os,periodDays){
 if(!myMap)return;
 currentPeriodDays=Math.max(1,Number(periodDays)||30);
 const next=new Map((os||[]).map(o=>[String(o.id),o]));
 Object.keys(markers).forEach(id=>{if(!next.has(String(id)))removeMarker(id)});
 next.forEach((o,id)=>{
   const existing=markers[id];
   if(!existing){addMarker(o);return}
   const lat=Number(o.latitude),lon=Number(o.longitude);
   if(Number.isFinite(lat)&&Number.isFinite(lon)) existing.geometry.setCoordinates([lat,lon]);
   existing.properties.set({
     balloonContentHeader:o.name||'',
     balloonContentBody:(o.address||'')+'<br><b>'+((o.category||'')+(o.subcategory?' → '+o.subcategory:''))+'</b>',
     ageDays:Number(o.age_days)||0
   });
   applyMarkerVisual(existing,selectedMarkerIds.has(id));
 });
}
function setSelectedMarkers(ids){selectedMarkerIds=new Set((ids||[]).map(String));Object.keys(markers).forEach(id=>{let m=markers[id];let selected=selectedMarkerIds.has(String(id));applyMarkerVisual(m,selected)})}
function centerOnOrg(id,lat,lon){if(!myMap)return;setSelectedMarkers([id])}
function parseBbox(b){try{let p=b.split('~').map(x=>x.split(',').map(Number));return [[p[0][1],p[0][0]],[p[1][1],p[1][0]]]}catch(e){return null}}
function _clearCityObjects(){
 cityObjects.forEach(x=>{try{myMap.geoObjects.remove(x)}catch(e){}});cityObjects=[];
}
function _addCityObjects(cities){
 // cityPoints is retained as the semantic name for settlement coordinates.
 const cityPoints=[];
 _clearCityObjects();
 const points=cityPoints;
 (cities||[]).forEach(c=>{
   const lat=Number(c.latitude),lon=Number(c.longitude);
   if(Number.isFinite(lat)&&Number.isFinite(lon)){
     const point=[lat,lon];
     const marker=new ymaps.Placemark(point,{balloonContentHeader:c.name,balloonContentBody:c.description||''},{preset:'islands#circleDotIcon',iconColor:'#333333'});
     cityObjects.push(marker);myMap.geoObjects.add(marker);points.push(point);
   }
   const b=parseBbox(c.bbox||'');
   if(b){
     const poly=new ymaps.Rectangle(b,{hintContent:c.name},{fillOpacity:.03,strokeWidth:2});
     cityObjects.push(poly);myMap.geoObjects.add(poly);
   }
 });
 return points;
}
function _fitPoints(points,minZoom,maxZoom,margin){
 if(!myMap||!points||!points.length)return false;
 try{myMap.container.fitToViewport()}catch(e){}
 if(points.length===1){
   myMap.setCenter(points[0],11,{duration:0,checkZoomRange:true});
 }else{
   let minLat=points[0][0],maxLat=points[0][0],minLon=points[0][1],maxLon=points[0][1];
   points.forEach(p=>{minLat=Math.min(minLat,p[0]);maxLat=Math.max(maxLat,p[0]);minLon=Math.min(minLon,p[1]);maxLon=Math.max(maxLon,p[1]);});
   if(Math.abs(maxLat-minLat)<0.0001&&Math.abs(maxLon-minLon)<0.0001){
     myMap.setCenter(points[0],11,{duration:0,checkZoomRange:true});
   }else{
     myMap.setBounds([[minLat,minLon],[maxLat,maxLon]],{checkZoomRange:true,zoomMargin:margin||60,duration:0});
     const z=myMap.getZoom();
     if(Number.isFinite(minZoom)&&z<minZoom)myMap.setZoom(minZoom,{duration:0,checkZoomRange:true});
     else if(Number.isFinite(maxZoom)&&z>maxZoom)myMap.setZoom(maxZoom,{duration:0,checkZoomRange:true});
   }
 }
 return true;
}
function _stableSettlementFit(points){
 const token=++viewportToken;
 lastViewport={kind:"settlements",points:points.slice()};
 const apply=()=>{
   if(!myMap||token!==viewportToken)return;
   try{myMap.container.fitToViewport()}catch(e){}
   _fitPoints(points,7,12,60);
 };
 apply();
 [120,350,800,1500].forEach(ms=>setTimeout(apply,ms));
}
function fitToSettlements(cities){
 if(!myMap){window.pendingMapFitCities=cities||[];return;}
 const points=_addCityObjects(cities||[]);
 if(!points.length)return;
 _stableSettlementFit(points);
}
function setMapLocations(cities){
 if(!myMap){window.pendingMapCities=cities||[];return;}
 fitToSettlements(cities||[]);
}
function setMapState(cities,organizations,periodDays,fitViewport){
 if(!myMap){window.pendingMapCities=cities||[];window.pendingMapOrganizations=organizations||[];window.pendingMapPeriodDays=periodDays||30;return;}
 currentPeriodDays=Math.max(1,Number(periodDays)||30);
 const points=_addCityObjects(cities||[]);
 updateMarkers(organizations||[],periodDays||30);
 if(fitViewport&&points.length)_stableSettlementFit(points);
}
function fitOnOrganizations(organizations){
 // Kept as a compatibility API, but organization selection must never
 // change the user's map viewport. Only marker styling is synchronized.
 const ids=(organizations||[]).map(o=>String(o.id));
 setSelectedMarkers(ids);
}
function applyPendingMapCities(){
 if(!myMap)return;
 if(Array.isArray(window.pendingMapCities)){const cities=window.pendingMapCities;delete window.pendingMapCities;const organizations=window.pendingMapOrganizations||[];delete window.pendingMapOrganizations;const periodDays=window.pendingMapPeriodDays||30;delete window.pendingMapPeriodDays;setMapState(cities,organizations,periodDays);return;}
 if(Array.isArray(window.pendingMapSelection)){const selection=window.pendingMapSelection;delete window.pendingMapSelection;fitOnOrganizations(selection);}
}
function init(){
 try{
   if(typeof qt!=="undefined"&&qt.webChannelTransport&&typeof QWebChannel!=="undefined"){
     new QWebChannel(qt.webChannelTransport,ch=>{webChannel=ch;window.bridge=ch.objects.bridge});
   }
 }catch(e){console.error("QWebChannel init error",e)}
 if(typeof ymaps==="undefined"){
   document.getElementById("map").innerHTML="<div style=\"padding:20px;font:14px Arial;color:#b00020\"><b>Не удалось загрузить Яндекс Карты.</b><br>Проверьте интернет, доступ QWebEngine к сети и API-ключ JavaScript.</div>";
   if(window.bridge){}
   return;
 }
 try{
   ymaps.ready(()=>{
     try{
       myMap=new ymaps.Map("map",{center:[53.20,50.15],zoom:11,controls:["zoomControl","fullscreenControl","typeSelector"]});
       const ready=()=>{try{applyPendingMapCities();if(webChannel&&webChannel.objects.bridge)webChannel.objects.bridge.onMapReady()}catch(e){console.error("MapBridge error",e)}};
       if(webChannel) ready(); else setTimeout(ready,500);
     }catch(e){document.getElementById("map").innerHTML="<pre style=\"padding:20px;white-space:pre-wrap;color:#b00020\">"+String(e)+"</pre>";console.error("Yandex map init error",e)}
   });
 }catch(e){document.getElementById("map").innerHTML="<pre style=\"padding:20px;white-space:pre-wrap;color:#b00020\">"+String(e)+"</pre>";console.error("Yandex API error",e)}
}
window.addEventListener('resize',()=>{
 if(!myMap||!lastViewport)return;
 const vp=lastViewport;
 setTimeout(()=>{
   if(!myMap||!lastViewport)return;
   try{myMap.container.fitToViewport()}catch(e){}
   if(vp.kind==='settlements')_fitPoints(vp.points,7,12,60);
 },80);
});
window.addEventListener('load',init);
</script></body></html>
