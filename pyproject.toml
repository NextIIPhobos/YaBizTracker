[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yabiztracker"
version = "1.0.0"
description = "Local desktop lead monitoring tool for Yandex Maps organizations"
requires-python = ">=3.10"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv", ".git", "__pycache__", "build", "dist", "backups", "logs"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E401", "E501", "E701", "E702", "F403"]
